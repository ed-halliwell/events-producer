version: '3.9'

networks:
  events:
    name: events
    driver: bridge

services:
  producer:
    container_name: events-producer
    image: event-producer
    build:
      context: ./
      dockerfile: ./Dockerfile
    networks:
      - events
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      QUEUE_URL: amqps://yttbbsxm:uWrk6gowG999I6WsxPzlZlnCy5pac8TR@kangaroo.rmq.cloudamqp.com/yttbbsxm
      QUEUE_NAME: eventdriven
      KAFKA_CLIENT_ID: my-app
      KAFKA_TOPIC_NAME: testtopic
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  zookeeper:
    image: confluentinc/cp-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - events
    ports:
      - "2181:2181"
  
  kafka:
    image: confluentinc/cp-kafka
    depends_on:
      - zookeeper
    networks:
      - events
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
  
  akhq:
    image: tchiotludo/akhq
    depends_on:
      - kafka
    networks:
      - events
    ports:
      - 8080:8080
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka-server:
              properties:
                bootstrap.servers: "kafka:9092"